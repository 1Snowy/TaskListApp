name: Build and Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Build and publish Windows app
        run: dotnet publish TaskListApp/TaskListApp.csproj -f net10.0-windows10.0.19041.0 -r win-x64 -c Release -p:WindowsPackageType=None -o ./publish-win

      - name: Run tests with results
        run: dotnet test TaskListApp/Tests/TaskListApp.Tests.csproj -c Release --logger "trx;LogFileName=test-results.trx" --results-directory ./test-results

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Test-results
          path: ./test-results

      - name: Upload Windows App
        uses: actions/upload-artifact@v4
        with:
          name: Todo-Windows-x64
          path: ./publish-win
