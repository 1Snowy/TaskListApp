name: Build and Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Restore dependencies
        run: |
          dotnet restore TaskListApp/TaskListApp.csproj
          dotnet restore TaskListApp/Tests/TaskListApp.Tests.csproj

      - name: Build main app (Windows)
        run: dotnet build TaskListApp/TaskListApp.csproj -f net10.0-windows10.0.19041.0 --configuration Release --no-restore

      - name: Build and run tests
        run: dotnet test TaskListApp/Tests/TaskListApp.Tests.csproj --configuration Release --no-restore --verbosity normal
