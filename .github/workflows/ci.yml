name: Build and Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Restore dependencies
        run: dotnet restore TaskListApp.sln

      - name: Build solution
        run: dotnet build TaskListApp.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test TaskListApp/Tests/TaskListApp.Tests.csproj --configuration Release --no-build --verbosity normal
